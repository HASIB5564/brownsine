   ========================================================================== */

/*
 * Outer gold V
 */

.fdg-promo-modal-offer-v2 .widget-bonus-content::before {

    background: linear-gradient(
        110deg,
        #1bb229 0%,
        #04e71a 25%,
        #1bb229 50%,
        #04e71a 75%,
        #1bb229 100%
    );
    background-size: 200% 100%;
    animation: bonusGradient 3s linear infinite;
}

.widget-claim-bonus-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(
        135deg,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
    );
    transform: skewX(-20deg);
    animation: bonusShine 3s ease-in-out infinite;
    pointer-events: none;
}

@keyframes bonusGradient {
    0% {
        background-position: 100% 50%;
        transform: scale(1);
    }
    50% {
        background-position: 50% 50%;
        transform: scale(0.97);
    }
    100% {
        background-position: 0% 50%;
        transform: scale(1);
    }
}

@keyframes bonusShine {
    0%,
    45% {
        left: -60%;
    }

    65%,
    100% {
        left: 150%;
    }
}
